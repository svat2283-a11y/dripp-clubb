name: Update catalog from Prom
on:
  schedule:
    - cron: '0 3,15 * * *'   # twice a day (06:00 and 18:00 Kyiv)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape.mjs
      - name: Commit if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update catalog" && git push)
