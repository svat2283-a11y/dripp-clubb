name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3,15 * * *'   # twice a day (06:00 and 18:00 Kyiv): refresh catalogue from Prom
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh catalogue from Prom
        if: github.event_name != 'push'
        run: node scripts/scrape.mjs
      - name: Save catalogue if changed
        if: github.event_name != 'push'
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update catalog" && git push)
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
